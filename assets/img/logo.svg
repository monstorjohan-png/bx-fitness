<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BX Fitness Hub">
  <defs>
    <linearGradient id="bx-volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFFF57"/>
      <stop offset="1" stop-color="#C8F134"/>
    </linearGradient>
    <linearGradient id="bx-fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFAA6B"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
  </defs>

  <!-- hexagon ring emblem -->
  <path d="M32 2.6 56.9 17.3v29.4L32 61.4 7.1 46.7V17.3Z" fill="none" stroke="url(#bx-volt)" stroke-width="1.5"/>
  <path d="M32 8.4 51.1 19.6v24.8L32 55.6 12.9 44.4V19.6Z" fill="none" stroke="url(#bx-volt)" stroke-width=".6" opacity=".45"/>

  <!-- volt bolt -->
  <path d="M35.4 12.5 18.6 35.2h8.1l-4.1 16.3 16.8-22.7h-8.1l4.1-16.3Z" fill="url(#bx-volt)"/>

  <!-- dumbbell bar -->
