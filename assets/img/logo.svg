  <!-- dumbbell plates -->
  <rect x="9.4" y="26.2" width="4.6" height="11.6" rx="1" fill="url(#bx-fire)"/>
  <rect x="50" y="26.2" width="4.6" height="11.6" rx="1" fill="url(#bx-fire)"/>
  <rect x="6" y="27.6" width="3.4" height="8.8" rx="1" fill="url(#bx-volt)"/>
  <rect x="54.6" y="27.6" width="3.4" height="8.8" rx="1" fill="url(#bx-volt)"/>
</svg>